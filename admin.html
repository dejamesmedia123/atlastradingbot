<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg:#0A0E14; --surface:rgba(255,255,255,0.045); --surface-strong:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.09); --text:#E8EDF2; --muted:#8B96A5;
    --mint:#2DD9A8; --mint-dim:rgba(45,217,168,0.14);
    --gold:#F0B429; --gold-dim:rgba(240,180,41,0.14);
    --rose:#FB7185; --rose-dim:rgba(251,113,133,0.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .glass{ background:var(--surface); border:1px solid var(--border); backdrop-filter:blur(18px); border-radius:16px; }
  .glass-strong{ background:var(--surface-strong); border:1px solid var(--border); backdrop-filter:blur(18px); border-radius:16px; }
  .muted{color:var(--muted);}
  ::-webkit-scrollbar{display:none;}
  .btn-primary{ background:var(--mint); color:#08110D; font-weight:600; border-radius:12px; padding:11px 16px; }
  .btn-primary:active{opacity:.85;}
  .btn-primary:disabled{opacity:.35;}
  .btn-ghost{ background:var(--surface-strong); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:11px 16px; }
  .btn-danger{ background:var(--rose-dim); color:var(--rose); border-radius:12px; padding:9px 14px; font-size:13px; }
  .chip{border-radius:999px; padding:4px 11px; font-size:12px; font-weight:600;}
  input, select, textarea{
    background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 12px; width:100%; font-family:'Inter',sans-serif; font-size:14px;
  }
  input::placeholder, textarea::placeholder{color:var(--muted);}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--mint);}
  label.field-label{font-size:11px; color:var(--muted); display:block; margin-bottom:4px;}
</style>
</head>
<body>

<div id="app" class="max-w-lg mx-auto min-h-screen flex flex-col pb-24">
  <div id="screen" class="flex-1 px-4 pt-5"></div>

  <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto px-4 hidden" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)">
    <div class="glass-strong flex justify-around items-center py-2.5 mt-3 overflow-x-auto">
      <button data-tab="stats" class="nav-btn flex flex-col items-center gap-1 px-2 py-1"><i data-lucide="gauge" class="w-5 h-5"></i><span class="text-[10px]">Stats</span></button>
      <button data-tab="bots" class="nav-btn flex flex-col items-center gap-1 px-2 py-1"><i data-lucide="bot" class="w-5 h-5"></i><span class="text-[10px]">Bots</span></button>
      <button data-tab="trades" class="nav-btn flex flex-col items-center gap-1 px-2 py-1"><i data-lucide="line-chart" class="w-5 h-5"></i><span class="text-[10px]">Trades</span></button>
      <button data-tab="deposits" class="nav-btn flex flex-col items-center gap-1 px-2 py-1"><i data-lucide="inbox" class="w-5 h-5"></i><span class="text-[10px]">Deposits</span></button>
      <button data-tab="withdrawals" class="nav-btn flex flex-col items-center gap-1 px-2 py-1"><i data-lucide="arrow-up-from-line" class="w-5 h-5"></i><span class="text-[10px]">Withdraw</span></button>
      <button data-tab="affiliates" class="nav-btn flex flex-col items-center gap-1 px-2 py-1"><i data-lucide="share-2" class="w-5 h-5"></i><span class="text-[10px]">Affiliates</span></button>
      <button data-tab="flags" class="nav-btn flex flex-col items-center gap-1 px-2 py-1"><i data-lucide="flag" class="w-5 h-5"></i><span class="text-[10px]">Flags</span></button>
      <button data-tab="more" class="nav-btn flex flex-col items-center gap-1 px-2 py-1"><i data-lucide="more-horizontal" class="w-5 h-5"></i><span class="text-[10px]">More</span></button>
    </div>
  </nav>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || { id: 'demo_admin' };
const TELEGRAM_ID = String(tgUser.id);

// ISO 3166-1 alpha-2 code, English short name, ISO 4217 currency code.

['AZ','Azerbaijan','AZN'],['BS','Bahamas','BSD'],['BH','Bahrain','BHD'],['BD','Bangladesh','BDT'],['BB','Barbados','BBD'],
['BY','Belarus','BYN'],['BE','Belgium','EUR'],['BZ','Belize','BZD'],['BJ','Benin','XOF'],['BT','Bhutan','BTN'],
['BO','Bolivia','BOB'],['BA','Bosnia and Herzegovina','BAM'],['BW','Botswana','BWP'],['BR','Brazil','BRL'],['BN','Brunei','BND'],
['BG','Bulgaria','BGN'],['BF','Burkina Faso','XOF'],['BI','Burundi','BIF'],['CV','Cabo Verde','CVE'],['KH','Cambodia','KHR'],
['CM','Cameroon','XAF'],['CA','Canada','CAD'],['CF','Central African Republic','XAF'],['TD','Chad','XAF'],['CL','Chile','CLP'],
['CN','China','CNY'],['CO','Colombia','COP'],['KM','Comoros','KMF'],['CG','Congo','XAF'],['CD','Congo (DRC)','CDF'],
['CR','Costa Rica','CRC'],['CI','Côte d\u2019Ivoire','XOF'],['HR','Croatia','EUR'],['CU','Cuba','CUP'],['CY','Cyprus','EUR'],
['CZ','Czechia','CZK'],['DK','Denmark','DKK'],['DJ','Djibouti','DJF'],['DM','Dominica','XCD'],['DO','Dominican Republic','DOP'],
['EC','Ecuador','USD'],['EG','Egypt','EGP'],['SV','El Salvador','USD'],['GQ','Equatorial Guinea','XAF'],['ER','Eritrea','ERN'],
['EE','Estonia','EUR'],['SZ','Eswatini','SZL'],['ET','Ethiopia','ETB'],['FJ','Fiji','FJD'],['FI','Finland','EUR'],
['FR','France','EUR'],['GA','Gabon','XAF'],['GM','Gambia','GMD'],['GE','Georgia','GEL'],['DE','Germany','EUR'],
['GH','Ghana','GHS'],['GR','Greece','EUR'],['GD','Grenada','XCD'],['GT','Guatemala','GTQ'],['GN','Guinea','GNF'],

['KG','Kyrgyzstan','KGS'],['LA','Laos','LAK'],['LV','Latvia','EUR'],['LB','Lebanon','LBP'],['LS','Lesotho','LSL'],
['LR','Liberia','LRD'],['LY','Libya','LYD'],['LI','Liechtenstein','CHF'],['LT','Lithuania','EUR'],['LU','Luxembourg','EUR'],
['MG','Madagascar','MGA'],['MW','Malawi','MWK'],['MY','Malaysia','MYR'],['MV','Maldives','MVR'],['ML','Mali','XOF'],
['MT','Malta','EUR'],['MH','Marshall Islands','USD'],['MR','Mauritania','MRU'],['MU','Mauritius','MUR'],['MX','Mexico','MXN'],

function flagEmoji(iso2) {
  if (!iso2 || iso2.length !== 2) return '';
  return String.fromCodePoint(...[...iso2.toUpperCase()].map(function(c){ return 127397 + c.charCodeAt(0); }));
}
function countryOptionsHtml(selectedCode) {
  return '<option value="">Select your country…</option>' + COUNTRIES.map(function(c){
    return '<option value="' + c.code + '"' + (c.code===selectedCode?' selected':'') + '>' + flagEmoji(c.code) + ' ' + c.name + '</option>';
  }).join('');
}
function currencyForCountry(code) {
  const c = COUNTRIES.find(function(x){ return x.code === String(code).toUpperCase(); });
  return c ? c.currency : 'USD';
}

let STATE = { role: null, bots: [] };

// Backend is now a static-friendly Google Apps Script JSON API (no more google.script.run,
// since this page is hosted on GitHub Pages, not served by Apps Script). Set this to your
// deployment's /exec URL.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx40Xn2jCWizJDV99DB5x2UXz56G9xPQYDXPj9J6p2OmS2eXCkrZmw95IPKAQFTWq49xg/exec';

function gs(fnName, ...args) {
  return new Promise((resolve) => {
    if (!SCRIPT_URL) {
      console.warn('preview mode (no SCRIPT_URL set):', fnName, args);
      resolve(mockBackend(fnName, args));
      return;
    }
    // GET, with the call encoded in the query string. Apps Script's /exec URL replies with
    // a redirect to actually run the request, and browsers silently turn a POST into a GET
    // (dropping the body) when following it — so POST-based RPC calls never really arrive.
    // GET isn't affected by that, which is why every call (reads AND writes) goes this way.
    const url = SCRIPT_URL + '?fn=' + encodeURIComponent(fnName) + '&args=' + encodeURIComponent(JSON.stringify(args));
    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (data && data.ok) resolve(data.result);
        else { console.error('Backend error for', fnName, data && data.error); resolve(mockBackend(fnName, args)); }
      })
      .catch(err => {
        console.error('Network error calling backend, falling back to preview mode:', fnName, err);
        resolve(mockBackend(fnName, args));
      });
  });
}

async function boot() {
  lucide.createIcons();
  const ok = await gs('isAdmin', TELEGRAM_ID);
  if (!ok) return renderUnauthorized();
  STATE.role = await gs('getAdminRole', TELEGRAM_ID);
  document.getElementById('bottomNav').classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => goTab(b.dataset.tab)));
  STATE.bots = await gs('getBots');
  goTab('stats');
}

function renderUnauthorized() {
  document.getElementById('screen').innerHTML = `
    <div class="pt-24 flex flex-col items-center text-center gap-3">
      <i data-lucide="shield-alert" class="w-7 h-7" style="color:var(--rose)"></i>
      <h1 class="text-lg font-semibold">Not authorized</h1>
      <p class="muted text-sm">Telegram ID ${TELEGRAM_ID} is not in the Admins sheet. The first person to ever open this admin page was auto-granted super admin — ask them to add you from Admins → Add admin.</p>
    </div>`;
  lucide.createIcons();
}

function setActiveNav(tab) { document.querySelectorAll('.nav-btn').forEach(b => b.style.color = b.dataset.tab === tab ? 'var(--mint)' : 'var(--muted)'); }

async function goTab(tab) {
  setActiveNav(tab);
  if (tab === 'stats') return renderStats();
  if (tab === 'bots') return renderBotsList();
  if (tab === 'trades') return renderTradesBotPicker();
  if (tab === 'deposits') return renderDeposits();
  if (tab === 'withdrawals') return renderWithdrawals();
  if (tab === 'affiliates') return renderAffiliates();
  if (tab === 'flags') return renderFlags();
  if (tab === 'more') return renderMore();
}

function screenHeader(title, actionHtml) { return `<div class="flex justify-between items-center mb-4"><h1 class="text-xl font-semibold">${title}</h1>${actionHtml||''}</div>`; }
function isSuper() { return STATE.role === 'super'; }

// ================= STATS =================
async function renderStats() {
  const s = await gs('adminGetStats', TELEGRAM_ID);
  document.getElementById('screen').innerHTML =
    screenHeader('Overview') +
    `<div class="grid grid-cols-2 gap-3">
      ${metricTile('Total AUM', '$' + s.totalAUM.toFixed(2), 'var(--mint)')}
      ${metricTile('Platform profit share earned', '$' + (s.platformProfitEarned||0).toFixed(2), 'var(--mint)')}
      ${metricTile('Active users', s.activeUsers, 'var(--text)')}
      ${metricTile('Pending deposits', s.pendingDeposits, s.pendingDeposits ? 'var(--gold)' : 'var(--text)')}
      ${metricTile('Pending withdrawals', s.pendingWithdrawals, s.pendingWithdrawals ? 'var(--gold)' : 'var(--text)')}
      ${metricTile('Payouts due', s.pendingPayouts, s.pendingPayouts ? 'var(--gold)' : 'var(--text)')}
      ${metricTile('Open flags', s.openFlags, s.openFlags ? 'var(--rose)' : 'var(--text)')}
    </div>
    <p class="muted text-[11px] mt-2">Profit share earned reflects each bot's cumulative trading return applied to its confirmed deposit base, less nothing on losing periods — it's a portfolio-level estimate, not a per-user ledger sum.</p>
    <p class="muted text-xs mt-5">Signed in as ${STATE.role === 'super' ? 'super admin' : 'support admin'}</p>`;
  lucide.createIcons();
}

function metricTile(label, value, color) {
  return `<div class="glass p-4"><p class="muted text-[11px]">${label}</p><p class="font-semibold text-xl mt-1" style="color:${color}">${value}</p></div>`;
}

// ================= BOTS =================
async function renderBotsList() {
  STATE.bots = await gs('getBots');
  document.getElementById('screen').innerHTML =
    screenHeader('Bots', isSuper() ? `<button id="addBotBtn" class="btn-primary flex items-center gap-1 text-sm px-3 py-2"><i data-lucide="plus" class="w-4 h-4"></i>Add</button>` : '') +
    `<div class="flex flex-col gap-3">${STATE.bots.map(adminBotCard).join('') || emptyState('bot','No bots yet','Add your first trading bot.')}</div>`;
  lucide.createIcons();
  if (isSuper()) {
    document.getElementById('addBotBtn').addEventListener('click', () => renderBotForm(null));
    document.querySelectorAll('[data-edit-bot]').forEach(el => el.addEventListener('click', () => renderBotForm(STATE.bots.find(b => String(b.id) === el.dataset.editBot))));
    document.querySelectorAll('[data-delete-bot]').forEach(el => el.addEventListener('click', async () => {
      if (!confirm('Remove this bot? It will be hidden from users.')) return;
      await gs('adminDeleteBot', TELEGRAM_ID, el.dataset.deleteBot);
      renderBotsList();
    }));
  }
  document.querySelectorAll('[data-waitlist-bot]').forEach(el => el.addEventListener('click', () => renderWaitlist(el.dataset.waitlistBot)));
}

function adminBotCard(bot) {
  return `<div class="glass p-4">
    <div class="flex justify-between items-start">
      <div><h3 class="font-semibold text-sm">${escapeHtml(bot.name)}</h3><p class="muted text-xs mt-0.5">${escapeHtml(bot.tvSymbol||'')} · $${bot.minDeposit||0}–$${bot.maxDeposit||'∞'}</p></div>
      <span class="chip" style="color:var(--mint);background:var(--mint-dim)">${bot.status||'Active'}</span>
    </div>
    <div class="flex gap-2 mt-3">
      ${isSuper() ? `<button class="btn-ghost text-xs px-3 py-1.5 flex-1" data-edit-bot="${bot.id}">Edit</button><button class="btn-danger flex-1" data-delete-bot="${bot.id}">Remove</button>` : ''}
      ${bot.waitlistEnabled ? `<button class="btn-ghost text-xs px-3 py-1.5 flex-1" data-waitlist-bot="${bot.id}">Waitlist</button>` : ''}
    </div>
  </div>`;
}

async function renderWaitlist(botId) {
  const bot = STATE.bots.find(b => String(b.id) === String(botId));
  const list = await gs('adminGetWaitlist', TELEGRAM_ID, botId);
  document.getElementById('screen').innerHTML = `
    <button id="backBtn" class="flex items-center gap-1 muted text-sm mb-4"><i data-lucide="chevron-left" class="w-4 h-4"></i> Bots</button>
    ${screenHeader('Waitlist — ' + escapeHtml(bot.name))}
    <div class="flex flex-col gap-2">${list.map(w => `<div class="glass p-3 text-sm">Telegram ${w.telegramId} · ${fmtDate(w.createdAt)}</div>`).join('') || emptyState('users','No one waiting','Waitlist is empty.')}</div>`;
  lucide.createIcons();
  document.getElementById('backBtn').addEventListener('click', renderBotsList);
}

function renderTradesBotPicker() {

    screenHeader('Trades') +
    `<p class="muted text-sm mb-3">Select a bot to manage its trades</p>

async function renderTradesForBot(botId) {
  const bot = STATE.bots.find(b => String(b.id) === String(botId));
  const trades = await gs('getTrades', botId);
  document.getElementById('screen').innerHTML = `
    <button id="backBtn" class="flex items-center gap-1 muted text-sm mb-4"><i data-lucide="chevron-left" class="w-4 h-4"></i> Trades</button>
    ${screenHeader(escapeHtml(bot.name), `<button id="addTradeBtn" class="btn-primary flex items-center gap-1 text-sm px-3 py-2"><i data-lucide="plus" class="w-4 h-4"></i>Add</button>`)}
    <button id="importBtn" class="btn-ghost w-full mb-4 flex items-center justify-center gap-2 text-sm"><i data-lucide="upload" class="w-4 h-4"></i>Bulk import CSV</button>
    <div class="flex flex-col gap-2">${trades.map(adminTradeRow).join('') || emptyState('line-chart','No trades yet','Log the first trade for this bot.')}</div>`;
  lucide.createIcons();
  document.getElementById('backBtn').addEventListener('click', renderTradesBotPicker);
  document.getElementById('addTradeBtn').addEventListener('click', () => renderTradeForm(bot, null));
  document.getElementById('importBtn').addEventListener('click', () => renderBulkImport(bot));
  document.querySelectorAll('[data-edit-trade]').forEach(el => el.addEventListener('click', () => gs('getTrades', botId).then(ts => renderTradeForm(bot, ts.find(t => String(t.id) === el.dataset.editTrade)))));
  document.querySelectorAll('[data-delete-trade]').forEach(el => el.addEventListener('click', async () => {
    if (!confirm('Delete this trade?')) return;
    await gs('adminDeleteTrade', TELEGRAM_ID, el.dataset.deleteTrade);
    renderTradesForBot(botId);
  }));
}

function adminTradeRow(t) {

    <div class="flex items-center gap-3">
      <span class="text-sm font-semibold" style="color:${profit>=0?'var(--mint)':'var(--rose)'}">${profit>=0?'+':''}${profit.toFixed(2)}%</span>
      <button data-edit-trade="${t.id}"><i data-lucide="pencil" class="w-3.5 h-3.5 muted"></i></button>
      <button data-delete-trade="${t.id}"><i data-lucide="trash-2" class="w-3.5 h-3.5" style="color:var(--rose)"></i></button>
    </div>
  </div>`;
}

  document.getElementById('screen').innerHTML = `

function renderBulkImport(bot) {
  document.getElementById('screen').innerHTML = `
    <button id="backBtn" class="flex items-center gap-1 muted text-sm mb-4"><i data-lucide="chevron-left" class="w-4 h-4"></i> ${escapeHtml(bot.name)}</button>

    <button id="importSubmit" class="btn-primary w-full mt-4">Import</button>
    <p id="importMsg" class="text-sm text-center mt-3"></p>
  `;
  lucide.createIcons();
  document.getElementById('backBtn').addEventListener('click', () => renderTradesForBot(bot.id));
  document.getElementById('importSubmit').addEventListener('click', async () => {
    const msgEl = document.getElementById('importMsg');
    try {

  });

        <label class="field-label">Flutterwave secret key ${secretsStatus.FLW_SECRET_KEY ? '· <span style="color:var(--mint)">configured</span>' : '· <span style="color:var(--rose)">not set</span>'}</label>
        <input id="flwSecret" type="password" placeholder="FLWSECK-...">
      </div>
      <div>
        <label class="field-label">Flutterwave webhook hash ${secretsStatus.FLW_WEBHOOK_HASH ? '· <span style="color:var(--mint)">configured</span>' : '· <span style="color:var(--rose)">not set</span>'}</label>
        <input id="flwHash" type="password" placeholder="Matches your Flutterwave dashboard webhook secret">
      </div>
      <button id="saveSecretsBtn" class="btn-primary w-full">Save keys</button>
      <p id="secretsMsg" class="text-sm text-center"></p>
    </div>
  `;
  lucide.createIcons();
  document.getElementById('backBtn').addEventListener('click', renderMore);
  loadFxRatesList();
  document.getElementById('refreshFxBtn').addEventListener('click', async () => {
    const listEl = document.getElementById('fxRatesList');
    listEl.innerHTML = `<p class="muted text-xs">Refreshing…</p>`;
    try { await gs('adminRefreshFxRates', TELEGRAM_ID); loadFxRatesList(); }
    catch (err) { listEl.innerHTML = `<p class="text-xs" style="color:var(--rose)">${err.message}</p>`; }
  });
  document.getElementById('setFxFallbackBtn').addEventListener('click', async () => {
    const msgEl = document.getElementById('fxFallbackMsg');
    const currency = document.getElementById('fxFallbackCurrency').value;
    const rate = document.getElementById('fxFallbackRate').value;
    try {
      await gs('adminSetFxFallbackRate', TELEGRAM_ID, currency, rate);
      msgEl.style.color = 'var(--mint)'; msgEl.textContent = 'Saved.';
      document.getElementById('fxFallbackCurrency').value = '';
      document.getElementById('fxFallbackRate').value = '';
      loadFxRatesList();
    } catch (err) { msgEl.style.color = 'var(--rose)'; msgEl.textContent = err.message; }
  });
  document.getElementById('settingsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = Object.fromEntries(fd.entries());
    const msgEl = document.getElementById('settingsMsg');
    try { await gs('adminSaveSettings', TELEGRAM_ID, payload); msgEl.style.color = 'var(--mint)'; msgEl.textContent = 'Saved.'; }
    catch (err) { msgEl.style.color = 'var(--rose)'; msgEl.textContent = err.message; }
  });
  document.getElementById('saveSecretsBtn').addEventListener('click', async () => {
    const msgEl = document.getElementById('secretsMsg');
    try {
      await gs('adminSaveSecrets', TELEGRAM_ID, {
        TELEGRAM_BOT_TOKEN: document.getElementById('tgToken').value,
        FLW_SECRET_KEY: document.getElementById('flwSecret').value,
        FLW_WEBHOOK_HASH: document.getElementById('flwHash').value
      });
      msgEl.style.color = 'var(--mint)'; msgEl.textContent = 'Saved.';
      setTimeout(renderSettings, 800);
    } catch (err) { msgEl.style.color = 'var(--rose)'; msgEl.textContent = err.message; }
  });
}

async function renderAuditLog() {
  const logs = await gs('adminGetAuditLog', TELEGRAM_ID);

    <button id="backBtn" class="flex items-center gap-1 muted text-sm mb-4"><i data-lucide="chevron-left" class="w-4 h-4"></i> More</button>
    ${screenHeader('Audit log')}
    <div class="flex flex-col gap-2">
      ${logs.map(l => `<div class="glass p-3 text-sm"><div class="flex justify-between"><span class="font-medium">${escapeHtml(l.action)}</span><span class="muted text-[11px]">${fmtDate(l.createdAt)}</span></div><p class="muted text-xs mt-1">Admin ${l.adminTelegramId} · ${escapeHtml(l.targetType)} ${escapeHtml(l.targetId)}</p></div>`).join('') || emptyState('history','No activity yet','Admin actions will appear here.')}
    </div>`;
  lucide.createIcons();
  document.getElementById('backBtn').addEventListener('click', renderMore);
}

async function renderAdmins() {
  const admins = await gs('adminListAdmins', TELEGRAM_ID);
  document.getElementById('screen').innerHTML = `
    <button id="backBtn" class="flex items-center gap-1 muted text-sm mb-4"><i data-lucide="chevron-left" class="w-4 h-4"></i> More</button>
    ${screenHeader('Admins')}
    <div class="flex flex-col gap-2 mb-4">
      ${admins.map(a => `<div class="glass p-3 flex justify-between items-center text-sm"><span>${escapeHtml(a.name)||a.telegramId}</span><span class="chip" style="color:var(--gold);background:var(--gold-dim)">${a.role}</span></div>`).join('')}
    </div>
    <div class="glass p-4 flex flex-col gap-3">
      <p class="text-xs font-semibold" style="color:var(--gold)">Add admin</p>
      <input id="newAdminId" placeholder="Telegram ID"><input id="newAdminName" placeholder="Name">
      <select id="newAdminRole"><option value="support">Support (approve deposits/withdrawals)</option><option value="super">Super (full access)</option></select>
      <button id="addAdminBtn" class="btn-primary w-full">Add</button>
      <p id="addAdminMsg" class="text-sm text-center"></p>
    </div>`;
  lucide.createIcons();
  document.getElementById('backBtn').addEventListener('click', renderMore);
  document.getElementById('addAdminBtn').addEventListener('click', async () => {
    const msgEl = document.getElementById('addAdminMsg');
    try {
      await gs('adminAddAdmin', TELEGRAM_ID, document.getElementById('newAdminId').value, document.getElementById('newAdminName').value, document.getElementById('newAdminRole').value);
      msgEl.style.color = 'var(--mint)'; msgEl.textContent = 'Added.';
      setTimeout(renderAdmins, 800);
    } catch (err) { msgEl.style.color = 'var(--rose)'; msgEl.textContent = err.message; }

}

async function loadFxRatesList() {
  const listEl = document.getElementById('fxRatesList');
  if (!listEl) return;
  const rates = await gs('adminGetFxRates', TELEGRAM_ID);
  listEl.innerHTML = rates.map(r => `
    <div class="flex justify-between text-xs">
      <span class="muted">1 USD = ${r.currency}</span>
      <span>${Number(r.rate).toLocaleString()} <span class="muted">· ${escapeHtml(r.source)}</span></span>
    </div>`).join('') || `<p class="muted text-xs">No rates cached yet — they'll populate as deposits happen, or hit Refresh now.</p>`;
}

// ---- utils ----
function escapeHtml(str) { return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str) { return escapeHtml(str); }
function fmtDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }); }
function toLocalInput(iso) { if (!iso) return ''; const d = new Date(iso); const pad = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function emptyState(icon, title, sub) { return `<div class="glass p-6 flex flex-col items-center text-center gap-2"><i data-lucide="${icon}" class="w-6 h-6 muted"></i><p class="font-medium text-sm">${title}</p><p class="muted text-xs">${sub}</p></div>`; }
